<body>

    <div class = "main">
        <button id = "b1">color</button>
        <button id = "b2">Bold</button>
        <button id = "b3">bg-color</button>
        <button id = "b4">reset</button>
    </div>
    <!-- </div> -->
     <!-- <div style="margin-top: 10px;">

    <div class = "lists" style = "margin-top : 10px;">
        <li id = "n1">one</li>
        <li id = "n2">two</li>
        <li id = "n3">three</li>
        <li id = "n4">four</li>
    </div>
    <script>
        $(() => {
            $('#b1').on('click', () => {
                $('#n1').css("background-color", "yellow");
            });

            $('#b2').on('click', () => {
                $('#n2').css("font-weight", "bold");
            });

            $('#b3').on('click', () => {
                $('#n3').css("color", "red");
            });

            $('#b4').on('click', () => {
                $('#n1').removeAttr('style');
                $('#n2').removeAttr('style');
                $('#n3').removeAttr('style');
            });
        });
    </script>
</body>
